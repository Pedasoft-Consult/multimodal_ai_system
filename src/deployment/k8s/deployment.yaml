# src/deployment/k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimodal-ai-system
  labels:
    app: multimodal-ai-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: multimodal-ai-system
  template:
    metadata:
      labels:
        app: multimodal-ai-system
    spec:
      containers:
      - name: multimodal-ai-system
        image: multimodal-ai-system:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "2"
            memory: "8Gi"
          requests:
            cpu: "1"
            memory: "4Gi"
        env:
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: multimodal-ai-config
              key: neo4j_uri
        - name: NEO4J_USER
          valueFrom:
            secretKeyRef:
              name: multimodal-ai-secrets
              key: neo4j_user
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: multimodal-ai-secrets
              key: neo4j_password
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: models-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: data-pvc